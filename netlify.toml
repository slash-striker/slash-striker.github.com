[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Netlify reserved paths like /netlify/functions/* should not be sent to the SPA fallback.
[build.processing]
  skip_processing = true

[[redirects]]
  from = "/api/youtube-latest"
  to = "/.netlify/functions/youtube-latest"
  status = 200

# SPA fallback for client-side routing (only on paths that are not static assets).
[[redirects]]
  from = "/*.html"
  to = "/.netlify/functions/_redirects"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
