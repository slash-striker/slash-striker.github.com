<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | SlashStr1ker</title>
    <meta
      name="description"
      content="The deep-space coordinates you entered lie outside the mapped SlashStr1ker network. Return to the main command center to resume navigation."
    />
    <meta name="theme-color" content="#050610" />
    <link rel="canonical" href="https://slash-striker.github.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #050610;
        --bg-secondary: #0a1020;
        --neon-cyan: #00f5ff;
        --text-primary: #f5f7ff;
        --text-secondary: #9ba8c7;
        --font-display: 'Orbitron', system-ui, -apple-system, sans-serif;
        --font-tech: 'Rajdhani', system-ui, -apple-system, sans-serif;
        --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        font-family: var(--font-sans);
        overflow-x: hidden;
      }
      .container {
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 24px;
      }
      h2 {
        font-family: var(--font-display);
        font-size: cl
amp(2rem, 4.2vw, 3.1rem);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-shadow: 0 0 28px rgba(0, 245, 255, 0.2);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .cyber-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 26px;
        font-family: var(--font-display);
        font-size: 0.84rem;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(57, 123, 255, 0.28));
        color: var(--text-primary);
        border: 1px solid var(--neon-cyan);
        box-shadow: 0 0 20px rgba(0, 245, 255, 0.25), inset 0 0 14px rgba(0, 245, 255, 0.15);
        transition: transform 0.22s ease, box-shadow 0.25s ease;
      }
      .cyber-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(0, 245, 255, 0.48), 0 0 60px rgba(57, 123, 255, 0.25);
      }
      .hud-panel {
        position: relative;
        background: linear-gradient(160deg, rgba(10, 16, 32, 0.82), rgba(5, 6, 16, 0.9));
        border: 1px solid rgba(0, 245, 255, 0.24);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        padding: 56px 40px;
        max-width: 680px;
        margin: 0 auto;
        text-align: center;
      }
      .hud-corner-tl {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 16px;
        height: 16px;
        border-top: 2px solid var(--neon-cyan);
        border-left: 2px solid var(--neon-cyan);
        pointer-events: none;
      }
      .hud-corner-br {
        position: absolute;
        bottom: 8px;
        right: 8px;
        width: 16px;
        height: 16px;
        border-bottom: 2px solid var(--neon-cyan);
        border-right: 2px solid var(--neon-cyan);
        pointer-events: none;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(0, 245, 255, 0.08);
        border: 1px solid rgba(0, 245, 255, 0.3);
        color: var(--neon-cyan);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      .eyebrow::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--neon-cyan);
        box-shadow: 0 0 10px var(--neon-cyan);
        animation: pulseDot 2.2s infinite ease-in-out;
      }
      .blink-ring {
        display: inline-block;
        width: 88px;
        height: 88px;
        margin: 8px auto 24px;
        border-radius: 50%;
        background: rgba(0, 245, 255, 0.1);
        border: 1px solid var(--neon-cyan);
        color: var(--neon-cyan);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 28px rgba(0, 245, 255, 0.28);
      }
      p {
        color: var(--text-secondary);
        font-size: 1.05rem;
        margin-bottom: 8px;
      }
      .center {
        text-align: center;
      }
      @keyframes pulseDot {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.35);
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .eyebrow::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="hud-panel">
        <span class="hud-corner-tl" aria-hidden="true" />
        <span class="hud-corner-br" aria-hidden="true" />

        <div class="eyebrow">
          <span>ERROR 404 // UNCHARTED SECTOR</span>
        </div>

        <div class="blink-ring" aria-hidden="true">
          ?
        </div>

        <h2>COORDINATES NOT FOUND</h2>

        <p>
          The deep-space coordinates you entered lie outside the mapped
          SlashStr1ker network. Return to the main command center to resume
          navigation.
        </p>

        <div style="margin-top: 32px; display: flex; justify-content: center;">
          <a href="/" class="cyber-btn">
            RETURN TO COMMAND CENTER
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
